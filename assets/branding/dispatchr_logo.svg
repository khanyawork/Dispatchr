<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dispatchr brand mark.

  Concept: a "D" monogram built from dispatch primitives — the stem and
  bowl of the letter are a route stroke; the bowl breaks at its apex for a
  field-node dot (a job stop on the route), and a hub dot sits inside the
  counter (the office dispatching the work). Hub, route, node.

  Geometry mirrors the in-app CustomPainter in
  lib/shared/widgets/app_logo.dart (100x100 design grid).
  Brand teal: #0F766E (light surfaces). On dark surfaces, recolor all
  fills/strokes to #2DD4BF.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Dispatchr logo">
  <!-- Stem of the D: a straight route segment -->
  <line x1="34" y1="18" x2="34" y2="82"
        stroke="#0F766E" stroke-width="12" stroke-linecap="round"/>

  <!-- Bowl of the D: a half-circle route (center 34,50 r 32), broken 26
       degrees either side of its apex to make room for the field node -->
  <path d="M 34 18 A 32 32 0 0 1 62.76 35.97"
        fill="none" stroke="#0F766E" stroke-width="12" stroke-linecap="round"/>
  <path d="M 62.76 64.03 A 32 32 0 0 1 34 82"
        fill="none" stroke="#0F766E" stroke-width="12" stroke-linecap="round"/>

  <!-- Field node: a job stop sitting in the break of the route -->
  <circle cx="66" cy="50" r="5.5" fill="#0F766E"/>

  <!-- Hub dot: the dispatch office inside the counter of the D -->
  <circle cx="48" cy="50" r="5" fill="#0F766E"/>
</svg>
